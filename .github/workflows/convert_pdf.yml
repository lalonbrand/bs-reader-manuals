name: Convert PDF to BS Reader WebP Manual

on:
  push:
    branches: [main]
    paths:
      - "incoming_pdfs/**"
      - "scripts/pdf_to_webp_book.py"
      - "scripts/translation_prompt.txt"
      - "scripts/translation_correction_prompt.txt"

  workflow_dispatch:
    inputs:
      rebuild_all:
        description: "Re-convert all PDFs in incoming_pdfs/ (true/false)"
        required: false
        default: false
        type: boolean
      file_id:
        description: "Optional Google Drive File ID"
        required: false
        type: string
      title:
        description: "Optional Manual Title"
        required: false
        type: string
      author:
        description: "Author / Department"
        required: false
        default: "BESTSELLER Manuals"
        type: string

  repository_dispatch:
    types: [new_pdf_detected]

permissions:
  contents: write

jobs:
  build-webp-manual:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Poppler & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pip
          pip install pdf2image pillow gdown pymupdf

      - name: Convert PDF(s) to WebP zip & update catalog.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          REBUILD_ALL: ${{ inputs.rebuild_all }}
          DISPATCH_FILE_ID: ${{ github.event.client_payload.fileId }}
          DISPATCH_FILE_NAME: ${{ github.event.client_payload.name }}
          INPUT_FILE_ID: ${{ inputs.file_id }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_AUTHOR: ${{ inputs.author }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e
          shopt -s nullglob nocaseglob
          BASE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"
          mkdir -p docs tmp_pdfs

          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::warning::GEMINI_API_KEY secret is not set — Bangla translations_bn.json will NOT be generated."
          else
            echo "GEMINI_API_KEY secret detected; enabling 2-pass Bangla translation."
          fi

          if [ "$EVENT_NAME" = "repository_dispatch" ] || { [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "$INPUT_FILE_ID" ]; }; then
            FILE_ID="${DISPATCH_FILE_ID:-$INPUT_FILE_ID}"
            RAW_NAME="${DISPATCH_FILE_NAME:-manual_${FILE_ID}.pdf}"
            SAFE_NAME="${RAW_NAME// /_}"
            PDF_PATH="tmp_pdfs/${SAFE_NAME}"

            gdown --id "$FILE_ID" -O "$PDF_PATH"

            CMD=(python -u scripts/pdf_to_webp_book.py "$PDF_PATH" \
              --output-dir docs \
              --base-url "$BASE_URL" \
              --catalog docs/catalog.json)

            [ -n "$INPUT_TITLE" ] && CMD+=(--title "$INPUT_TITLE")
            [ -n "$INPUT_AUTHOR" ] && CMD+=(--author "$INPUT_AUTHOR")
            "${CMD[@]}"
          else
            SCRIPT_CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'scripts/pdf_to_webp_book.py' 'scripts/translation_prompt.txt' 'scripts/translation_correction_prompt.txt' || true)
            DELETED_PDFS=()
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              mapfile -t DELETED_PDFS < <(git diff --name-only --diff-filter=D HEAD~1 HEAD -- 'incoming_pdfs/*.pdf' 'incoming_pdfs/*.PDF')
            fi

            TARGET_PDFS=()
            if [ "$REBUILD_ALL" = "true" ] || [ -n "$SCRIPT_CHANGED" ] || ! git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              TARGET_PDFS=(incoming_pdfs/*.pdf)
            else
              mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'incoming_pdfs/*.pdf' 'incoming_pdfs/*.PDF')
              if [ ${#CHANGED[@]} -gt 0 ]; then
                TARGET_PDFS=("${CHANGED[@]}")
              elif [ ${#DELETED_PDFS[@]} -eq 0 ]; then
                TARGET_PDFS=(incoming_pdfs/*.pdf)
              fi
            fi

            for pdf in "${TARGET_PDFS[@]}"; do
              [ -f "$pdf" ] || continue
              echo "Converting $pdf ..."
              python -u scripts/pdf_to_webp_book.py "$pdf" \
                --output-dir docs \
                --base-url "$BASE_URL" \
                --catalog docs/catalog.json
            done

            # Always prune docs/catalog.json and docs/ archives when PDFs are deleted from incoming_pdfs/
            python -u scripts/pdf_to_webp_book.py \
              --prune-only \
              --output-dir docs \
              --catalog docs/catalog.json \
              --sync-incoming-dir incoming_pdfs
          fi

          python - <<'PY' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          import glob, json, os, re, sys, zipfile

          print("### BS Reader Manual Conversion & Bangla Translation Summary\n")
          print("| Archive | Translated Pages | Paragraphs | Status |")
          print("|---|---|---|---|")
          for zpath in sorted(glob.glob("docs/*.zip")):
              zname = os.path.basename(zpath)
              with zipfile.ZipFile(zpath) as zf:
                  names = zf.namelist()
                  page_files = [n for n in names if re.match(r"^page_\d+\.webp$", n)]
                  total_pages = len(page_files)
                  if "translations_bn.json" in names:
                      bundle = json.loads(zf.read("translations_bn.json").decode("utf-8"))
                      pages = bundle.get("pages", [])
                      translated_pages = 0
                      total_paras = 0
                      for p in pages:
                          items = p.get("paragraphs") or p.get("lines") or []
                          non_empty = [it for it in items if str(it.get("bn", "")).strip()]
                          if non_empty:
                              translated_pages += 1
                              total_paras += len(non_empty)
                      print(f"Verified {zname}: {translated_pages}/{total_pages} pages, {total_paras} paragraphs", file=sys.stderr)
                      print(f"| `{zname}` | {translated_pages} / {total_pages} | {total_paras} | Included |")
                  else:
                      print(f"::warning::translations_bn.json NOT found inside {zpath}", file=sys.stderr)
                      print(f"| `{zname}` | 0 / {total_pages} | 0 | Not included |")
          PY

          rm -rf tmp_pdfs

      - name: Commit & push updated catalog.json and archives
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Publish WebP manual and update catalog.json"
          git push
