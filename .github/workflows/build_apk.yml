name: Build BS Reader APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build_apk.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure pre-installed Android SDK & licenses
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_DIR/cmdline-tools"
            ls -la "$SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"
          ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools" "$SDK_DIR/licenses"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore
        run: |
          set -euo pipefail
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          ls -lh debug.keystore
          test -s debug.keystore

      - name: Verify Firebase google-services.json
        run: |
          set -euo pipefail
          if [ ! -f app/google-services.json ]; then
            echo "::error::app/google-services.json is missing from this repository. Commit app/google-services.json before building BS-Reader.apk so Firebase AI Translation and Exam Center work."
            exit 1
          fi
          if grep -q "remixed-project-id" app/google-services.json; then
            echo "::error::app/google-services.json still contains placeholder 'remixed-project-id'."
            exit 1
          fi

      - name: Build BS Reader Debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare BS-Reader.apk
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/debug/app-debug.apk BS-Reader.apk
          ls -lh BS-Reader.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BS-Reader-APK
          path: BS-Reader.apk

      - name: Publish BS-Reader.apk to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BS Reader APK (Latest)
          body: "Latest compiled Android APK for BS Reader (Bestseller Manuals)."
          files: BS-Reader.apk
          make_latest: true
