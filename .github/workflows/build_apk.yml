name: Build BS Reader APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/build_apk.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Build BS Reader Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare BS-Reader.apk
        run: cp app/build/outputs/apk/debug/app-debug.apk BS-Reader.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BS-Reader-APK
          path: BS-Reader.apk

      - name: Publish BS-Reader.apk to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BS Reader APK (Latest)
          body: "Latest compiled Android APK for BS Reader (Bestseller Manuals)."
          files: BS-Reader.apk
          make_latest: true
