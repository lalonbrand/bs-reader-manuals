name: Build BS Reader APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - "debug.keystore.base64"
      - "gradle/**"
      - ".github/workflows/build_apk.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure pre-installed Android SDK & licenses
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          sudo chown -R "$(id -u):$(id -g)" "$SDK_DIR"
          SDKMANAGER=$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_DIR/cmdline-tools"
            ls -la "$SDK_DIR"
            exit 1
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" --install "platforms;android-36.1" || true
          ls -la "$SDK_DIR/platforms" "$SDK_DIR/build-tools" "$SDK_DIR/licenses"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare signing keystores
        run: |
          set -euo pipefail
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          rm -f /tmp/release-upload.jks
          keytool -importkeystore \
            -srckeystore debug.keystore \
            -srcstorepass android \
            -srcalias androiddebugkey \
            -srckeypass android \
            -destkeystore /tmp/release-upload.jks \
            -deststorepass android \
            -destalias upload \
            -destkeypass android
          ls -lh debug.keystore /tmp/release-upload.jks
          test -s /tmp/release-upload.jks

      - name: Restore or verify Firebase config & Gemini API Key
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Restored app/google-services.json from GitHub Secrets."
          fi
          if [ ! -f app/google-services.json ]; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "::warning::app/google-services.json is missing in GitHub. Push app/google-services.json or add GOOGLE_SERVICES_JSON secret so Exam Center initializes."
            echo "### Firebase Config: MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "Add \`GOOGLE_SERVICES_JSON\` in GitHub Repository Secrets (or push \`app/google-services.json\`) and re-run this workflow." >> "$GITHUB_STEP_SUMMARY"
          elif grep -q "remixed-project-id" app/google-services.json; then
            echo "HAS_GOOGLE_SERVICES=false" >> "$GITHUB_ENV"
            echo "::warning::app/google-services.json contains placeholder 'remixed-project-id'."
            echo "### Firebase Config: PLACEHOLDER" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "HAS_GOOGLE_SERVICES=true" >> "$GITHUB_ENV"
            echo "Verified app/google-services.json is present."
            echo "### Firebase Config: OK" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -n "$GEMINI_API_KEY" ]; then
            printf 'GEMINI_API_KEY=%s\n' "$GEMINI_API_KEY" > .env
            echo "HAS_GEMINI_API_KEY=true" >> "$GITHUB_ENV"
            echo "Configured .env from GEMINI_API_KEY GitHub Secret."
            echo "### Gemini API Key: OK" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "HAS_GEMINI_API_KEY=false" >> "$GITHUB_ENV"
            echo "::warning::GEMINI_API_KEY secret is missing in GitHub. Add GEMINI_API_KEY in Settings -> Secrets and variables -> Actions and re-run Build BS Reader APK."
            echo "### Gemini API Key: MISSING" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build BS Reader Release APK
        env:
          KEYSTORE_PATH: /tmp/release-upload.jks
          STORE_PASSWORD: android
          KEY_PASSWORD: android
        run: gradle :app:assembleRelease --no-daemon --console=plain --stacktrace -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"

      - name: Prepare BS-Reader.apk
        run: |
          set -euo pipefail
          rm -f /tmp/release-upload.jks .env
          cp app/build/outputs/apk/release/app-release.apk BS-Reader.apk
          VERSION_NAME=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "VERSION_NAME=${VERSION_NAME:-latest}" >> "$GITHUB_ENV"
          ls -lh BS-Reader.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BS-Reader-APK
          path: BS-Reader.apk

      - name: Publish BS-Reader.apk to Latest Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest HEAD
          git push -f origin latest

          RELEASE_TITLE="BS Reader v${VERSION_NAME} (Latest)"
          if [ "${HAS_GOOGLE_SERVICES:-false}" = "true" ]; then
            FIREBASE_STATUS="Firebase config (google-services.json): INCLUDED"
          else
            FIREBASE_STATUS="Firebase config (google-services.json): MISSING — add GOOGLE_SERVICES_JSON secret in GitHub Settings -> Secrets and variables -> Actions and re-run Build BS Reader APK."
          fi
          if [ "${HAS_GEMINI_API_KEY:-false}" = "true" ]; then
            GEMINI_STATUS="Gemini API Key (GEMINI_API_KEY): INCLUDED"
          else
            GEMINI_STATUS="Gemini API Key (GEMINI_API_KEY): MISSING — add GEMINI_API_KEY secret in GitHub Settings -> Secrets and variables -> Actions and re-run Build BS Reader APK."
          fi
          RELEASE_BODY="Latest compiled Release APK for BS Reader v${VERSION_NAME} (Bestseller Manuals). Built from commit ${GITHUB_SHA::7}."$'\n\n'"${FIREBASE_STATUS}"$'\n'"${GEMINI_STATUS}"

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest BS-Reader.apk --clobber
            gh release edit latest --title "$RELEASE_TITLE" --notes "$RELEASE_BODY" --latest
          else
            gh release create latest BS-Reader.apk --title "$RELEASE_TITLE" --notes "$RELEASE_BODY" --latest
          fi
